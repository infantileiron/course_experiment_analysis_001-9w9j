<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课程实验分析</title><link rel="stylesheet" href="/static/style.css"></head><body><header><h1>课程实验分析 · 001</h1><p>固定周期 · 用户级分析 · 口径锁定与可追溯结果</p></header><main><aside><section class="panel"><h2>创建实验</h2><form id="config"><label>数据版本</label><select id="dataset"></select><a id="sample" class="muted">下载当前事件CSV</a><label>实验名称</label><input id="name" value="课程引导改版实验" required><label>窗口开始（UTC）</label><input id="start" type="datetime-local" value="2026-01-01T00:00" required><label>窗口结束（UTC，不含）</label><input id="end" type="datetime-local" value="2026-02-01T00:00" required><label>主要指标</label><select id="metric"><option value="completion_rate">结课率</option><option value="study_minutes">人均学习分钟</option><option value="bounce_rate">未学习率</option></select><label>最小可检测差异（绝对值）</label><input id="mde" type="number" min="0.001" step="0.001" value="0.05"><label>期望B组占比</label><input id="allocation" type="number" min="0.05" max="0.95" step="0.01" value="0.5"><label>显著性水平</label><input id="alpha" type="number" min="0.001" max="0.19" step="0.001" value="0.05"><label>预先约定人群（逗号分隔）</label><input id="segments" value="new,returning"><p class="muted">创建后锁定窗口、指标与数据版本。调整设置请创建新实验。</p><button>锁定并分析</button></form></section><section class="panel"><h2>上传事件</h2><form id="upload"><input type="file" id="file" accept=".csv" required><p class="muted">UTF-8 CSV：user_id, group, event, time, minutes, segment。event取exposure、study、complete。</p><button class="secondary">创建数据版本</button></form></section><section class="panel"><h2>历史分析</h2><div id="history"></div></section></aside><article><div id="status"></div><div id="result" class="panel"><h2>准备分析</h2><p>内置无效果、真实提升和分组异常三种数据。选择数据后创建实验，查看分流诊断、指标差异和学习时长分布。</p><p class="muted">结课率与未学习率按曝光用户计算；学习时长按用户累加。所有指标均保留，避免只选择有利结果。</p></div></article></main><script>
const $=x=>document.getElementById(x), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let current;
async function api(path,opts){const r=await fetch(path,opts);const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}const fmt=x=>x==null?'—':typeof x==='number'?x.toFixed(4):esc(x);
async function refresh(){let ds=await api('/api/datasets');$('dataset').innerHTML=ds.map(x=>`<option value="${x.id}">${esc(x.name)} · ${x.row_count}行</option>`).join('');$('dataset').onchange=()=>{$('sample').href='/api/datasets/'+$('dataset').value+'/download'};$('dataset').onchange();let h=await api('/api/runs');$('history').innerHTML=h.map(r=>`<a class="history-item" data-run="${r.id}">${esc(r.experiment_name)}<br><span class="muted">${esc(r.created_at.slice(0,19))}</span></a>`).join('')||'<p class="muted">暂无分析</p>';document.querySelectorAll('[data-run]').forEach(a=>a.onclick=()=>busy(async()=>show(await api('/api/runs/'+a.dataset.run))))}
async function busy(fn){$('status').textContent='正在计算…';document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await fn();$('status').textContent='已完成并保存分析版本'}catch(e){$('status').textContent=e.message}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
function bars(distribution){let out='';for(const [g,d]of Object.entries(distribution)){let max=Math.max(...d.minutes_histogram,1);out+=`<h3>${g}组学习分钟分布</h3><svg viewBox="0 0 620 170">`+d.minutes_histogram.map((v,i)=>`<rect x="${i*76+12}" y="${130-v/max*105}" width="45" height="${v/max*105}" fill="${g==='A'?'#247d98':'#df9845'}"/><text x="${i*76+34}" y="${120-v/max*105}" text-anchor="middle" font-size="11">${v}</text><text x="${i*76+34}" y="150" text-anchor="middle" font-size="10">${d.bins[i]}</text>`).join('')+'</svg>'}return out}
function show(run){current=run;let r=run.result;$('result').innerHTML=`<h2>${esc(run.experiment_name)}</h2><span class="badge">${r.finished?'已到结束时间':'实验进行中'}</span><div class="cards"><div class="card"><strong>${r.counts.A}</strong><span>A组独立用户</span></div><div class="card"><strong>${r.counts.B}</strong><span>B组独立用户</span></div><div class="card"><strong>${fmt(r.srm_p_value)}</strong><span>分流比例检验p值</span></div></div>${r.warnings.map(w=>`<div class="warning">${esc(w)}</div>`).join('')}<h3>总体指标</h3><div class="scroll"><table><tr><th>指标</th><th>A均值</th><th>B均值</th><th>差值 B−A</th><th>置信区间</th><th>校正p值</th></tr>${r.metrics.map(m=>`<tr><td>${esc(m.label)}<br><small>${esc(m.role)}</small></td><td>${fmt(m.mean_a)}</td><td>${fmt(m.mean_b)}</td><td>${fmt(m.effect)}</td><td>${fmt(m.ci_low)} ～ ${fmt(m.ci_high)}</td><td>${fmt(m.adjusted_p)}<br>${m.significant?'存在统计差异':m.status==='ok'?'未达阈值':'样本不足'}</td></tr>`).join('')}</table></div><p class="muted">总体三指标使用Holm校正；表中置信区间为未校正区间。比率采用比例差正态近似，分钟数采用Welch检验。</p><h3>人群分析</h3><div class="scroll"><table><tr><th>人群</th><th>类型</th><th>A/B人数</th><th>效应</th><th>校正p值</th></tr>${r.segments.map(s=>`<tr><td>${esc(s.segment)}</td><td>${esc(s.kind)}</td><td>${s.n_a}/${s.n_b}</td><td>${fmt(s.effect)}</td><td>${fmt(s.adjusted_p)}</td></tr>`).join('')}</table></div><label>事后探索人群</label><input id="explore" placeholder="例如new"><button id="exploreButton" class="secondary">保存新的探索分析</button><h3>样本规划</h3><p>MDE：${r.sample_plan.mde}；80%功效近似需要A组${r.sample_plan.required_a_approx??'无法估计'}人、B组${r.sample_plan.required_b_approx??'无法估计'}人。</p><p class="muted">${esc(r.sample_plan.note)}</p><div class="plot">${bars(r.distribution)}</div><h3>结论</h3><p>${esc(r.conclusion)}</p><a class="button" href="/api/export/${run.id}">下载结论与完整分析JSON</a><details><summary>锁定配置及数据指纹</summary><pre>${esc(JSON.stringify(run.config_snapshot,null,2))}</pre></details>`;$('exploreButton').onclick=()=>busy(async()=>{show(await api('/api/analyze/'+current.experiment_id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({explore_segment:$('explore').value})}));await refresh()})}
$('config').onsubmit=e=>{e.preventDefault();busy(async()=>{let c=await api('/api/experiments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('name').value,dataset_id:$('dataset').value,start:$('start').value+'Z',end:$('end').value+'Z',primary_metric:$('metric').value,mde:+$('mde').value,alpha:+$('alpha').value,allocation_b:+$('allocation').value,planned_segments:$('segments').value.split(',').map(s=>s.trim()).filter(Boolean)})});show(await api('/api/analyze/'+c.id,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}));await refresh()})};$('upload').onsubmit=e=>{e.preventDefault();busy(async()=>{let f=new FormData();f.append('file',$('file').files[0]);let d=await api('/api/datasets',{method:'POST',body:f});await refresh();$('dataset').value=d.id;$('dataset').onchange()})};busy(refresh);
</script></body></html>
